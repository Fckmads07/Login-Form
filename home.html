<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="city-night.jpg">
    <link rel="stylesheet" href="login.css?v=3">
    <title>Home</title>
    <script src="auth.js"></script>
    <script>
        // Pas connecté : retour à la page de login
        if (!getSession()) location.replace('login.html');
    </script>
</head>
<body>
    <div class="wrapper home">
        <h1>Welcome, <span id="username"></span>!</h1>
        <p class="home-text">You are logged in. Next time you come back, you will be logged in automatically.</p>
        <button type="button" id="logout" class="btn">Logout</button>
    </div>

    <script>
        const session = getSession();
        if (session) document.getElementById('username').textContent = session.username;

        document.getElementById('logout').addEventListener('click', () => {
            clearSession();
            location.replace('login.html?loggedout=1');
        });
    </script>
    <p class="photo-credit">Photo: <a href="https://commons.wikimedia.org/wiki/File:New_York_City_at_night_HDR.jpg" target="_blank" rel="noopener">Paulo Barcellos Jr.</a>, <a href="https://creativecommons.org/licenses/by-sa/2.0/" target="_blank" rel="noopener">CC BY-SA 2.0</a></p>
</body>
</html>
