<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="city-night.jpg">
    <link rel="stylesheet" href="login.css?v=3">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <title>Login</title>
    <script src="auth.js"></script>
    <script>
        // Déjà connecté (session gardée en mémoire) : on va directement à l'accueil
        if (getSession()) location.replace('home.html');
    </script>
</head>
<body>
    <div class="wrapper">
        <form id="login-form" novalidate>
            <h1>Login</h1>
            <p id="message" class="message" role="alert"></p>
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" autocomplete="username" required>
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
                <i class="bx bxs-lock-alt"></i>
            </div>
            <div class="remember">
                <label><input type="checkbox" id="remember" checked>Remember Me</label>
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit" class="btn">Login</button>

            <div class="register-link">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const message = document.getElementById('message');
        const usernameInput = document.getElementById('username');

        usernameInput.value = getLastUsername();

        const params = new URLSearchParams(location.search);
        if (params.get('loggedout')) showMessage(message, 'You have been logged out.', 'success');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            if (!username || !password) {
                showMessage(message, 'Please fill in all fields.', 'error');
                return;
            }

            const result = await loginUser(username, password, remember);
            if (result.ok) {
                location.replace('home.html');
            } else {
                showMessage(message, result.error, 'error');
            }
        });
    </script>
    <p class="photo-credit">Photo: <a href="https://commons.wikimedia.org/wiki/File:New_York_City_at_night_HDR.jpg" target="_blank" rel="noopener">Paulo Barcellos Jr.</a>, <a href="https://creativecommons.org/licenses/by-sa/2.0/" target="_blank" rel="noopener">CC BY-SA 2.0</a></p>
</body>
</html>
